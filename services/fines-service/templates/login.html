<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Отчет по штрафам</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&subset=cyrillic&display=swap">
<link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
</head>
<body class="login-body">
<div class="login-box">
  <img src="/static/logo.svg" alt="МетОптТорг">
  <h1>Отчет по штрафам</h1>
  <div class="sub">МетОптТорг · юридический отдел</div>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Пароль" autofocus required>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">Войти</button>
  </form>
</div>
</body>
</html>
