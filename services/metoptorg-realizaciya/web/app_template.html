.bbrow{border-bottom:1px solid var(--line-1)}
.bbh{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  cursor:pointer;flex-wrap:wrap}
.bbh:hover{background:var(--hover)}
.bbrow.open>.bbh{background:var(--s-2)}
.bbh .tw{width:14px;color:var(--t-3);flex:none}
.bbnm{flex:1 1 320px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--t-1)}
.bbv{flex:none;font-variant-numeric:tabular-nums;font-weight:600;color:var(--t-1);
  white-space:nowrap}
.bbv i{font-style:normal;font-weight:400;font-size:var(--fs-cap);color:var(--t-3)}
.bbv.rev{color:var(--ok)}
.bbv.muted{color:var(--t-4);font-weight:500}
.bbkids{display:none;padding:0 var(--sp-3) var(--sp-3)}
.bbrow.open>.bbkids{display:block}
/* ветки версий лук/дсп — второй уровень разбора: проект -> версия -> НМК
   (заказчик 02.09.2026: «декомпозиция как в других вкладках»). Ветка
   раскрывается кликом, внутри — своя таблица номенклатуры. */
.bbver{border:1px solid var(--line-1);border-radius:var(--r-2);
  margin:0 0 var(--sp-2);overflow:hidden}
.bbvh{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);
  cursor:pointer;background:var(--s-1)}
.bbvh:hover{background:var(--hover)}
.bbver.open>.bbvh{background:var(--s-2)}
.bbvh .tw{width:14px;color:var(--t-3);flex:none}
.bbvh b{min-width:52px;letter-spacing:.4px}
.bbvv{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ok)}
.bbvv i{font-style:normal;font-weight:400;font-size:var(--fs-cap);color:var(--t-3)}
/* плановый объём в шапке ветки: рядом с выручкой, со сверкой к факту */
.bbvp{font-variant-numeric:tabular-nums;font-weight:600;color:var(--t-1);
  display:inline-flex;align-items:baseline;gap:var(--sp-1)}
.bbvp i{font-style:normal;font-weight:400;font-size:var(--fs-cap);color:var(--t-3)}
.bbvp em{font-style:normal;font-size:var(--fs-cap);font-weight:600}
.bbvp em.ok{color:var(--ok)}
.bbvp em.no{color:#b45309}
.bbvp.muted{color:var(--t-4);font-weight:500}
/* блок «План из расчёта»: таблица позиций Excel над таблицей факта */
.bbpl{margin-bottom:var(--sp-3)}
.bbpl-h{font-size:var(--fs-sm);font-weight:600;margin:var(--sp-2) 0 var(--sp-1);
  color:var(--t-1)}
.bbpl-h .muted{font-weight:400;font-size:var(--fs-cap)}
.bbt.plan th{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.bbt.plan td{background:color-mix(in srgb,var(--warn) 4%,transparent)}
.bbt.plan td:first-child{max-width:420px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.bbvs{margin-left:auto;font-size:var(--fs-cap);color:var(--t-3);cursor:help}
.bbvs.ok{color:var(--ok);font-weight:600}
.bbvk{display:none;padding:0 var(--sp-3) var(--sp-2)}
.bbver.open>.bbvk{display:block}
.bbtr-note{font-size:var(--fs-cap);color:var(--t-3);margin-bottom:var(--sp-2)}
/* позиция, прошедшая переработку: значок ⇄ и подсказка «купили трубу — продали лом» */
.bbt tr.mix td:first-child{cursor:help}
.mixi{font-style:normal;color:var(--accent);cursor:help}
.bbt{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.bbt th{text-align:left;font-size:var(--fs-cap);text-transform:uppercase;
  letter-spacing:.3px;color:var(--t-2);padding:var(--sp-1) var(--sp-2);
  border-bottom:1px solid var(--line-2)}
.bbt td{padding:2px var(--sp-2);border-bottom:1px solid var(--line-1);
  font-variant-numeric:tabular-nums}
.bbt th.num,.bbt td.num{text-align:right}
.bbt th.plan,.bbt td.plan{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.bbw{color:var(--t-2);max-width:380px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:help}
.bbw i{font-style:normal;color:var(--t-3);font-variant-numeric:tabular-nums}
/* план, разнесённый по нашей НМК: цвет только у тонн — недобор и перевыполнение
   к плану видно сразу, суммы остаются нейтральными */
/* факт выручки: своя подложка, чтобы рубли не путались с тоннами */
.bbt th.rub,.bbt td.rub,table th.rub,table td.rub{background:color-mix(in srgb,var(--ok) 6%,transparent)}
.bbvv em{font-style:normal;font-size:var(--fs-cap);font-weight:600;margin-left:6px}
.bbvv em.ok{color:var(--ok)} .bbvv em.no{color:#b45309}
.tag.deal{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--t-1);font-weight:600}
.tag.deal.q{border:1px dashed var(--warn)}
.bbt th.sh,.bbt td.sh{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.bbw u.pw{text-decoration:underline dotted;color:var(--warn);font-size:var(--fs-cap);cursor:help}
.bbv.bad{color:var(--bad)}
.bbmk small{font-size:var(--fs-micro);line-height:1.1}
.bbt td.plan.ok{color:var(--ok);font-weight:600}
.bbt td.plan.bad{color:var(--bad);font-weight:600}
.bbt tfoot td{border-top:1px solid var(--line-2);border-bottom:none;
  padding-top:var(--sp-1);font-weight:600}
.bbmk{color:var(--t-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:help}
.bbpn{font-size:var(--fs-cap);color:var(--t-3);margin:var(--sp-1) 0 var(--sp-3)}
.bbpn b{color:var(--t-1)}
.bbpn span{cursor:help;border-bottom:1px dotted var(--line-2)}

/* ---- ВКЛАДКА «ДАШБОРД» (01–02.09.2026) ----
   Экран оперативки: карточки итогов и динамики, короткие списки «стало хуже» и
   «на грани», ниже — дивизионы, разложенные по группам (регионы, базы,
   демонтаж, прочее).
   ⚠️ КРУПНО, А НЕ ПЛОТНО (заказчик 02.09.2026: «дашборд хороший, но очень
   мелкий — сделай побольше»). Его показывают с ПРОЕКТОРА на совещании, где
   читают через весь кабинет: цифры карточек 30 px, полосы 34 px, подписи
   дивизионов и итоги — базовым кеглем. Две колонки остались, но включаются с
   1500 px: на ноутбуке крупные полосы в две колонки уже не читаются, и одна
   колонка честнее, чем сжатые пополам. */
.dashp{padding:var(--sp-4)}
/* ⚠️ КАРТОЧКИ — ОДИН РЯД И ОДИН РАЗМЕР (заказчик 02.09.2026). Все блоки равной
   ширины и кегля: глаз сравнивает числа, а не размеры плашек. Ряд переносится
   только когда физически не влезает; на широком экране это одна строка. */
.dcards{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3);
  align-items:stretch}
.dcard{font:inherit;text-align:left;cursor:pointer;flex:1 1 158px;max-width:230px;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--line-2);
  border-radius:var(--r-2);background:var(--s-1);color:var(--t-2);
  font-size:var(--fs-cap);line-height:1.25}
.dcard b{display:flex;align-items:center;gap:6px;font-size:20px;line-height:1.15;
  color:var(--t-1);font-variant-numeric:tabular-nums;font-weight:700;
  margin-bottom:1px;white-space:nowrap}
.dcard b i{width:12px;height:12px;border-radius:2px;flex:none}
.dcard i{display:block;font-style:normal;color:var(--t-3);font-size:var(--fs-micro)}
button.dcard:hover{background:var(--hover);border-color:var(--accent)}
/* общий итог — единственный акцентный блок ряда */
.dcard.sum{background:var(--s-2)}
.dcard.sum b{font-size:22px}
/* карточки динамики и «на грани» — не кнопки, а сводка: без hover-подсветки */
.dcard.dyn{background:color-mix(in srgb,var(--accent) 6%,transparent);cursor:default}
.dcard.edge{background:color-mix(in srgb,var(--warn) 10%,transparent);cursor:default}
.dcard.edge b{color:#b45309}
.dcard.dyn.bad b{color:var(--bad)}
@media (max-width:900px){ .dcard{flex:1 1 132px} .dcard b{font-size:17px} }

/* легенда цветов полос — под карточками, крупно и в одну строку */
.dlegend{display:flex;gap:var(--sp-3) var(--sp-4);flex-wrap:wrap;
  font-size:var(--fs-sm);color:var(--t-2);margin:0 0 var(--sp-4);
  padding:var(--sp-2) var(--sp-3);background:var(--s-2);border-radius:var(--r-2)}
.dlegend i{display:inline-block;width:16px;height:12px;border-radius:2px;
  vertical-align:-1px;margin-right:6px}

/* короткие списки «стало хуже за неделю» и «на грани» */
.dchg{margin:0 0 var(--sp-4);border:1px solid var(--line-1);border-radius:var(--r-2);
  overflow:hidden}
.dchg-h{padding:var(--sp-2) var(--sp-4);background:var(--s-2);font-weight:600;
  font-size:var(--fs-base)}
.dchg.edge .dchg-h{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.dchg-i{display:flex;width:100%;gap:var(--sp-3);align-items:center;font:inherit;
  font-size:var(--fs-base);text-align:left;cursor:pointer;background:none;border:none;
  border-top:1px solid var(--line-1);padding:var(--sp-2) var(--sp-4);color:var(--t-1)}
.dchg-i:hover{background:var(--hover)}
.dchg-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchg-b{flex:none;color:var(--t-2);font-size:var(--fs-sm)}
.dchg-b b{color:var(--bad)}
.dchg-t{flex:none;width:126px;text-align:right;font-variant-numeric:tabular-nums;
  font-weight:700;font-size:var(--fs-lg,17px)}

/* два экрана: «сейчас» и «было на <понедельник>» (заказчик 02.09.2026).
   Второй экран приглушён рамкой и подписью, чтобы на совещании было сразу
   понятно, какая половина — прошлое. */
.dscr{margin-bottom:var(--sp-4)}
.dscr-h{font-size:var(--fs-lg,17px);font-weight:700;margin-bottom:var(--sp-2);
  padding-bottom:var(--sp-1);border-bottom:2px solid var(--accent)}
.dscr-h .muted{font-weight:400;font-size:var(--fs-sm)}
.dscr.was{opacity:.92;border-left:3px solid var(--line-2);padding-left:var(--sp-3)}
.dscr.was .dscr-h{border-bottom-color:var(--line-2);color:var(--t-2)}
/* дельта дивизиона к «было»: вниз — хорошо (вывезли), вверх — плохо */
.ddlt{width:104px;flex:none;text-align:right;font-variant-numeric:tabular-nums;
  font-size:var(--fs-sm);font-weight:600;cursor:help}
.ddlt.good{color:var(--ok)}
.ddlt.bad{color:var(--bad)}
.ddlt.zero{color:var(--t-4)}
@media (max-width:900px){ .ddlt{width:72px;font-size:var(--fs-cap)} }

/* группы дивизионов — две колонки только на широком экране (см. ⚠️ выше) */
.dgrid{display:grid;grid-template-columns:1fr;gap:var(--sp-4) var(--sp-5)}
@media (min-width:1500px){ .dgrid{grid-template-columns:1fr 1fr} }
.dgrp-h{font-weight:700;font-size:var(--fs-lg,17px);color:var(--t-1);
  padding-bottom:var(--sp-1);margin-bottom:var(--sp-2);
  border-bottom:2px solid var(--line-2)}
.dgrp-h .muted{font-weight:400;font-size:var(--fs-sm)}
.drow{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}
.ddiv{font:inherit;font-size:var(--fs-base);width:196px;flex:none;text-align:right;
  cursor:pointer;border:none;background:none;color:var(--t-1);padding:1px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent}
.ddiv:hover{color:var(--accent);border-bottom-color:var(--accent)}
.dbar{flex:1;display:flex;height:34px;border-radius:var(--r-2);overflow:hidden;
  background:color-mix(in srgb,var(--line-1) 40%,transparent)}
.dseg{border:none;padding:0;cursor:pointer;min-width:3px;opacity:.94;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* ⚠️ ЦИФРА НА ЛИНИИ — БЕЛАЯ С ТЕНЬЮ: сегменты идут от жёлтого до тёмно-красного,
   один цвет текста на всех не читается, а тень даёт контраст и на жёлтом. */
.dseg i{font-style:normal;font-size:var(--fs-sm);font-weight:700;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
.dseg:hover{opacity:1;outline:2px solid var(--t-1);outline-offset:-2px;z-index:1}
.dsum{width:118px;flex:none;text-align:right;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--t-1);font-size:var(--fs-lg,17px)}
@media (max-width:900px){
  .ddiv{width:128px;font-size:var(--fs-sm)}
  .dsum{width:88px;font-size:var(--fs-base)}
  .dbar{height:26px}
  .dcard b{font-size:24px}
}

/* ---- ВКЛАДКА «ВЕРСИИ БП» (25.08.2026) ----
   Таблица выбора верной версии расчёта. Смысловые цвета: зелёная строка —
   версия подтверждена экономистом, красная — отклонена, жёлтая — «по
   умолчанию» (последняя по дате, выбор ещё не сделан). Кнопки ✓/✗ всегда
   видимы: вкладка рабочая, наведение на планшете недоступно. */
.bvt{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.bvt th{position:sticky;top:0;background:var(--s-2);z-index:1;text-align:left;
  font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.3px;
  color:var(--t-2);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line-2)}
.bvt td{padding:var(--sp-1) var(--sp-3);border-bottom:1px solid var(--line-1);
  font-variant-numeric:tabular-nums}
.bvt th.num,.bvt td.num{text-align:right}
.bvt tr.bvh td{background:var(--s-2);font-weight:600;padding-top:var(--sp-2)}
.bvt .bvs{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bvt tr.ok td{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.bvt tr.bad td{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--t-3)}
.bvt tr.dflt td{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.bvm{font-size:var(--fs-cap);color:var(--t-2);white-space:nowrap}
tr.ok .bvm{color:var(--ok);font-weight:600}
tr.bad .bvm{color:var(--bad)}
.bvb{white-space:nowrap}
.bvb button{font:inherit;min-width:34px;min-height:30px;cursor:pointer;
  border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--s-1);
  color:var(--t-2);margin-left:4px}
.bvb button:hover{background:var(--hover)}
.bvb .bok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bvb .bbad.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---- документы строками ВНУТРИ номенклатуры: то же расположение колонок,
   что у строк дерева, поэтому количество документа встаёт ровно в свою ячейку
   (уехало / приехало / в производство / ПРОДАЛИ …) ---- */
.doclines{margin:2px 0 var(--sp-2) 0}
.dl{display:flex;align-items:center;gap:var(--sp-2);padding:2px var(--sp-2);
  font-size:var(--fs-sm)}
.dl:hover{background:var(--hover)}
.dl:hover>.hd{background:var(--hover)}
.dl .tw{width:16px;flex:none;border-left:1px solid var(--line-1);height:16px}
.dl>.hd{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-2);overflow:hidden;
  position:sticky;left:0;background:var(--s-1);z-index:1}
.dl .lbl{flex:1;min-width:0;display:flex;gap:var(--sp-2);align-items:baseline;
  overflow:hidden;white-space:nowrap}
.dl .lbl .dt{min-width:78px;flex:none;color:var(--t-3);font-variant-numeric:tabular-nums}
.dl .lbl .rn{min-width:108px;flex:none;font-family:var(--mono);color:var(--accent)}
.dl .lbl .ph{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dl .val{flex:none;text-align:right}
/* заголовок лота — та же сетка, но итог по лоту */
.dl.lot{background:var(--s-2);border-radius:var(--r-1);margin-top:var(--sp-1);
  font-size:var(--fs-sm)}
.dl.lot>.hd{background:var(--s-2)}
.dl.lot .lbl{color:var(--t-1);font-weight:500}
/* ---- ФОКУС НА ДОКУМЕНТЕ ----
   Номер документа кликабелен: подсвечиваются все его вхождения на вкладке.
   Цвет — «взаимодействие», а не статус: это выбор пользователя, и он не должен
   читаться как «здесь расхождение». */
.rn{cursor:pointer}
.rn:hover{text-decoration:underline}
.dochit{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dochit>.hd,tr.dochit td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dl.dochit,.cline.dochit,.fate .fl.dochit{box-shadow:inset 2px 0 0 var(--accent)}
.docbar{position:fixed;left:var(--sp-4);bottom:var(--sp-4);z-index:60;display:flex;
  align-items:center;gap:var(--sp-2);background:var(--s-3);border:1px solid var(--line-2);
  border-left:3px solid var(--accent);border-radius:var(--r-3);padding:var(--sp-2) var(--sp-3);
  box-shadow:var(--lift);font-size:var(--fs-sm);max-width:calc(100vw - 32px)}
.docbar b{font-family:var(--mono);font-weight:600}
.docbar .hint{margin:0;white-space:nowrap}
@media (max-width:768px){ .docbar{left:var(--sp-2);right:var(--sp-2);bottom:var(--sp-2);flex-wrap:wrap} }

/* ---- РАСХОЖДЕНИЕ ПО ДОКУМЕНТУ И ЕГО ПРОДОЛЖЕНИЕ ----
   Значок в строке: сколько ушло по документу и сколько вернулось. Цвет здесь —
   статус (сошлось / угар в пределах / расхождение), четвёртое значение цвета не
   заводим. Строка с расхождением ещё и отбита слева тем же цветом: значок
   маленький, а в списке из сотни документов глаз ищет цветную засечку. */
.dgap{display:inline-block;font-size:var(--fs-micro);font-weight:600;white-space:nowrap;
  padding:1px var(--sp-2);border-radius:20px;flex:none;margin-left:var(--sp-1);
  border:1px solid;background:var(--chip-bg);color:var(--chip-fg);border-color:var(--chip-br)}
.dgap,.fate .fp.gap{--chip-bg:color-mix(in srgb,var(--chip) 12%,var(--s-1));
  --chip-fg:color-mix(in srgb,var(--chip) 72%,var(--t-1));
  --chip-br:color-mix(in srgb,var(--chip) 28%,var(--s-1))}
[data-theme=dark] .dgap{--chip-bg:color-mix(in srgb,var(--chip) 18%,var(--s-1));
  --chip-fg:color-mix(in srgb,var(--chip) 68%,var(--t-1));
  --chip-br:color-mix(in srgb,var(--chip) 34%,var(--s-1))}
.g-bad{--chip:var(--bad)} .g-warn{--chip:var(--warn)} .g-mix{--chip:var(--accent)}
.g-ok{--chip:var(--ok)}
.dl.gap-bad,.cline.gap-bad{box-shadow:inset 2px 0 0 var(--bad)}
.dl.gap-warn,.cline.gap-warn{box-shadow:inset 2px 0 0 var(--warn)}
.dl.gap-mix,.cline.gap-mix{box-shadow:inset 2px 0 0 var(--accent)}
table.mv tr.gap-bad td:first-child{box-shadow:inset 2px 0 0 var(--bad)}
table.mv tr.gap-warn td:first-child{box-shadow:inset 2px 0 0 var(--warn)}
table.mv tr.gap-mix td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
/* строка, у которой есть продолжение: наведение показывает карточку */
.hasfate{cursor:help}
.dl.fate-on,.cline.fate-on,tr.fate-on td{background:var(--hover)}
/* карточка «что вышло по документу»: ТРЕТЬЕ и последнее место в интерфейсе,
   где допустима тень, — она физически парит над таблицей (см. шапку файла) */
.fatepop{position:fixed;z-index:70;width:min(560px,calc(100vw - 24px));
  max-height:min(62vh,620px);overflow:auto;background:var(--s-3);
  border:1px solid var(--line-2);border-radius:var(--r-3);box-shadow:var(--lift);
  padding:var(--sp-3);font-size:var(--fs-sm);color:var(--t-1)}
.fatepop.pin{border-color:var(--line-3)}
.fate .wh1{font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.4px;
  color:var(--t-2);font-weight:600;margin:var(--sp-3) 0 var(--sp-1)}
.fate-h{display:flex;gap:var(--sp-2);align-items:baseline;flex-wrap:wrap;
  padding-bottom:var(--sp-2);border-bottom:1px solid var(--line-1)}
.fate-h .dt{color:var(--t-3);font-variant-numeric:tabular-nums;flex:none}
.fate-h .rn{font-family:var(--mono);color:var(--accent);flex:none}
.fate-h .nmn{flex:1;min-width:0;color:var(--t-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
/* пара документа: ушло / пришло / расхождение — три строки одной сеткой */
.fate .fp{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:var(--sp-2);
  align-items:baseline;padding:2px 0}
.fate .fp>span:first-child{color:var(--t-3);font-size:var(--fs-cap)}
.fate .fp b{font-variant-numeric:tabular-nums;font-weight:600}
.fate .fp b i{font-style:normal;color:var(--t-3);font-weight:400;font-size:var(--fs-cap)}
.fate .fp .hint{margin:0;text-align:right}
.fate .fp.gap{border-top:1px solid var(--line-1);margin-top:2px;padding-top:var(--sp-1)}
.fate .fp.gap b{color:var(--chip-fg)}
.fate .fp.gap.g-ok b{color:var(--ok)}
/* строка продолжения: дата · документ · поток · количество · куда */
.fate .fl{display:flex;gap:var(--sp-2);align-items:baseline;padding:2px 0;
  border-top:1px solid var(--line-1)}
.fate .fl .dt{min-width:76px;flex:none;color:var(--t-3);font-variant-numeric:tabular-nums}
.fate .fl .rn{min-width:104px;flex:none;font-family:var(--mono);color:var(--accent)}
.fate .fl .q{min-width:92px;text-align:right;flex:none;font-weight:600;
  font-variant-numeric:tabular-nums}
.fate .fl .q i{font-style:normal;font-weight:400;color:var(--t-3);font-size:var(--fs-cap)}
.fate .fl .to{flex:1;min-width:0;color:var(--t-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.fate .fl .nmn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fate .fl.past{opacity:.7}
/* строка, с которой пришли: она одна в этой цепочке своя */
.fate .fl.me{background:var(--s-2);border-radius:var(--r-1);font-weight:600}
.fate .fl.me .to{color:var(--t-3);font-weight:400;font-size:var(--fs-cap)}
.fate-tot{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px solid var(--line-1);
  color:var(--t-2);font-size:var(--fs-cap)}
.fate-tot b{color:var(--t-1);font-variant-numeric:tabular-nums}
@media (max-width:768px){
  .fate .fl{flex-wrap:wrap}
  .fate .fl .to{flex:1 1 100%}
}
/* ---- построчные движения (§5): документ · что произошло · откуда · куда ---- */
table.mv{font-size:var(--fs-sm)}
table.mv td{padding:var(--sp-1) var(--sp-2);vertical-align:top}
table.mv td.nw{white-space:nowrap}
table.mv td.rn{font-family:var(--mono);color:var(--accent);white-space:nowrap}
table.mv td.lot{font-family:var(--mono);font-size:var(--fs-cap);white-space:nowrap}
/* подпись потока: внешний приход зелёный, внутреннее серое, выбытие красное —
   чтобы «перекладывание того же металла» не читалось как приход или расход */
.fchip{display:inline-block;font-size:var(--fs-micro);font-weight:600;
  padding:1px var(--sp-2);border-radius:20px;white-space:nowrap;border:1px solid;
  background:var(--chip-bg);color:var(--chip-fg);border-color:var(--chip-br)}
.f-in{--chip:var(--ok)}
.f-mv{--chip:var(--t-3);font-weight:500;font-style:italic}
.f-out{--chip:var(--bad)}
/* цепочка по лоту: строки идут подряд, как путь металла */
.chain{border:1px solid var(--line-1);border-radius:var(--r-3);padding:var(--sp-2) var(--sp-3);
  margin:var(--sp-2) 0;background:var(--s-2)}
.chain-h{display:flex;gap:var(--sp-2);align-items:baseline;margin-bottom:var(--sp-1);
  font-size:var(--fs-base);font-weight:500}
.cline{display:flex;gap:var(--sp-2);align-items:baseline;padding:2px 0;font-size:var(--fs-sm);
  border-top:1px solid var(--line-1)}
.cline .dt{min-width:82px;flex:none;color:var(--t-3);font-variant-numeric:tabular-nums}
.cline .rn{min-width:112px;flex:none;font-family:var(--mono);color:var(--accent)}
.cline .q{min-width:78px;text-align:right;flex:none;font-variant-numeric:tabular-nums;
  font-weight:600}
.cline .ph{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cline .nmn{min-width:150px;max-width:220px;flex:none;color:var(--t-3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ============================ АДАПТИВНОСТЬ ============================
   Узкий экран НЕ сжимает таблицы в кашу — они прокручиваются вбок, подпись
   закреплена. Точки перелома и что на них происходит — в system.md. */
/* ⚠️ НА ШИРОКОМ ЭКРАНЕ ПОДПИСЬ РАСТЁТ. Ширины закреплённых колонок — числа, а
   не доли: `.gmetrics` стоит на `left:var(--gl)`, и sticky требует известного
   смещения. Поэтому вместо резинки — ступеньки по ширине окна. До этой правки
   подпись была 396 px на любом мониторе, а таблица цифр рядом — 532 px, то есть
   БОЛЬШЕ подписи: названия проектов и строки декомпозиции (там ступенька
   вложенности ест ширину внутри тех же 396 px) срезались даже на 27-дюймовом
   экране, где места вагон. */
@media (min-width:1700px){ .gantt{--gl:500px} }
@media (min-width:2000px){ .gantt{--gl:600px} }

@media (max-width:1440px){
  :root{--lc-col:84px;--lc-inn:76px;--lc-sold:100px;--lc-bal:92px}
  /* +44 px на колонку значков состава — та же добавка, что на широком экране,
     иначе на ноутбуке названия бизнес-планов режутся сильнее, чем до значков */
  .gantt{--gl:344px;--gm:568px}
  .gantt.slim{--gm:212px}
  .gmetrics{grid-template-columns:minmax(0,82px) minmax(0,54px) minmax(0,58px)
    minmax(0,74px) minmax(0,96px) minmax(0,86px) minmax(0,66px);gap:var(--sp-2)}
}
@media (max-width:1200px){
  /* «куплено» рядом с «продано» уходит: та же цифра есть в полосе движений */
  .two i.b,.colhead .two i.b{display:none}
}
@media (max-width:1024px){
  main{padding:var(--sp-3)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card.lead{grid-column:span 2}
  /* зона управления сворачивается: на планшете она занимала три ряда и
     отодвигала данные ниже первого экрана */
  .toolbar{gap:var(--sp-2)}
  input[type=search]{flex:1 1 100%}
}
@media (max-width:768px){
  :root{--lc-col:80px;--lc-inn:72px;--lc-sold:96px;--lc-bal:88px;--two-col:80px}
  header{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
  .brand{font-size:var(--fs-base)}
  .brand small{display:none}
  .hmeta{margin-left:0;order:3;flex:1 1 100%;text-align:left;
    border-top:1px solid var(--line-1);padding-top:var(--sp-2)}
  .hact{margin-left:auto}
  nav.tabs{top:auto;position:static;padding:0 var(--sp-2)}
  .gantt{--gl:220px;--gm:0px;max-height:70vh}
  /* подпись здесь всего 220 px — значки состава ужимаются, чтобы не съесть
     треть колонки; узнаваемость держит крупный ведущий значок */
  .gantt .matset{--mi:12px;grid-template-columns:26px var(--mi);width:40px}
  .gantt .matset .lead{--mi:26px}
  /* на планшете метрики Ганта не помещаются рядом со шкалой — шкала важнее,
     цифры возвращает кнопка «шире диаграмму» */
  .gantt .gmetrics{display:none}
  /* срок вывоза с карандашом обычно живёт в колонке метрик; раз её тут нет,
     переносим в подпись — иначе правка срока на планшете недоступна */
  .gantt .gplan2{display:inline-flex}
  .gnm{font-size:var(--fs-sm)}
  .doc,.cline{flex-wrap:wrap}
}
@media (max-width:480px){
  :root{--lc-col:76px;--lc-inn:70px;--lc-sold:92px;--lc-bal:84px}
  main{padding:var(--sp-2)}
  /* ведущая метрика во всю ширину, подчинённые — в два столбца: пять карточек
     в один столбец занимали весь первый экран, и до данных надо было листать */
  .cards{grid-template-columns:1fr 1fr;gap:var(--sp-2)}
  .card.lead{grid-column:span 2}
  .card:not(.lead){padding:var(--sp-2)}
  .card:not(.lead) .v{font-size:var(--fs-md)}
  .card:not(.lead) .k{font-size:var(--fs-micro)}
  .card:not(.lead) .s{font-size:var(--fs-micro)}
  .panel{padding:var(--sp-2);border-radius:var(--r-2)}
  .toolbar{padding:var(--sp-2)}
  select,input[type=search],input[type=text],input[type=month]{flex:1 1 100%;min-width:0}
  /* шапка в три компактных ряда вместо башни */
  header{padding:var(--sp-2) var(--sp-2);gap:var(--sp-2) var(--sp-2)}
  .brand{font-size:var(--fs-base);letter-spacing:.4px}
  .logo{width:22px;height:22px}
  .hact{gap:var(--sp-1)}
  .hact .btn{font-size:var(--fs-cap);padding:0 var(--sp-2)}
  .hmeta{font-size:var(--fs-micro);padding-top:var(--sp-1)}
  .hmeta b{font-size:var(--fs-sm)}
  .row .val{min-width:0}
}
/* палец вместо мыши: цели нажатия WCAG 44px */
@media (pointer:coarse){
  .btn,.btn2,.btn3,nav.tabs button,.gzoom button,.gmore,.gpop-b button{min-height:44px}
  select,input[type=search],input[type=text],input[type=month],input[type=date]{min-height:44px}
  .row{min-height:44px}
  .row .tw{width:24px}
  .gpen{min-width:44px;min-height:44px}
  label{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .row.open>.tw{transform:none}
}

/* ============================ ПЕЧАТЬ (A4) ============================
   Зона управления и навигация не печатаются, фон снимается, шапка таблицы
   повторяется на каждой странице, строки не рвутся пополам. */
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{--s-0:#fff;--s-1:#fff;--s-2:#fff;--s-3:#fff;--hover:#fff;
        --t-1:#000;--t-2:#333;--t-3:#555;--t-4:#777;
        --line-1:#bbb;--line-2:#666;--lift:none}
  body{background:#fff}
  /* Дерево на бумаге: полоса из десяти колонок шире листа, и правые колонки
     («списание на затраты», «остаток») уезжали за край. Ужимаем колонки и
     колонку подписи под ширину A4 — прокрутки на бумаге нет.
     Кегли тоже уменьшаем именно здесь: они заданы в пикселях, и font-size
     у body их не масштабирует — числа продолжали бы обрезаться. */
  :root{--fs-micro:7px;--fs-cap:8px;--fs-sm:9px;--fs-base:10px;
        --fs-md:12px;--fs-lg:15px;--fs-xl:19px;
        --lc-col:64px;--lc-inn:54px;--lc-sold:84px;--lc-bal:78px;--lc-gap:2px;
        --two-col:70px;--sp-3:8px;--sp-4:10px}
  html.wide .row>.hd,html.wide .dl>.hd,html.wide .colhead>.hd{
    flex:0 0 calc(270px - var(--ind,0px))}
  html.wide .tree .row,html.wide .tree .dl,
  html.wide .tree .colhead,html.wide .tree .colhead-box{width:auto;min-width:0}
  html.wide .row .lbl,html.wide .dl .lbl{white-space:normal;overflow:hidden}
  header{position:static;border-bottom:1px solid #666}
  header .hact,nav.tabs,.toolbar,.gzoom,.gpen,.gmore,.fold,.secnav,
  #wrapBtn,#themeBtn,#adminBtn{display:none!important}
  main{max-width:none;padding:0}
  .panel,.card,.gantt{border:1px solid #bbb;break-inside:avoid}
  .cards{gap:4pt}
  .scroll,.tree,.gantt{max-height:none;overflow:visible}
  thead{display:table-header-group}
  tr,.row,.node,.grow,.dl{break-inside:avoid}
  .colhead-box,.ghead,th{position:static}
  .row>.hd,.colhead>.hd,.dl>.hd,.glbl,.gmetrics{position:static}
  a.link{color:#000;text-decoration:underline}
  details.note{border:1px solid #bbb}
  details.note>summary{font-weight:700}
}
</style>
</head>
<body>
<!-- ЗНАЧКИ «ИЗ ЧЕГО СОСТОИТ БИЗНЕС-ПЛАН» ==========================================
     Категория материала = группа аналитического учёта 1С (НоменклатурнаяГруппаГрузов).
     Значки монохромные и различаются ФОРМОЙ: цвет в этом интерфейсе уже занят —
     статусом (--ok/--warn/--bad) и взаимодействием (--accent), красить ими материал
     нельзя, иначе в строке Ганты два разных смысла одного цвета.
     Соответствие «группа -> значок» живёт в MAT_OF (web/tabs.js), подписи там же. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- труба НКТ: тело трубы и муфта с резьбой на конце -->
  <symbol id="mi-nkt" viewBox="0 0 24 24"><rect x="2.6" y="8.4" width="12.6" height="7.2" rx="1"/><rect x="15.2" y="6.2" width="6.2" height="11.6" rx="1.2"/><path d="M17.3 6.2v11.6M19.3 6.2v11.6"/></symbol>
  <!-- труба большого диаметра: одно крупное кольцо (труба с торца) -->
  <symbol id="mi-pipeL" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/></symbol>
  <!-- труба малого диаметра: два кольца поменьше -->
  <symbol id="mi-pipeS" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4.8"/><circle cx="8" cy="12" r="2"/><circle cx="17.6" cy="12" r="3.4"/><circle cx="17.6" cy="12" r="1.3"/></symbol>
  <!-- труба и штанга вместе: кольцо трубы и пруток -->
  <symbol id="mi-pipe" viewBox="0 0 24 24"><circle cx="8.5" cy="12" r="6"/><circle cx="8.5" cy="12" r="2.8"/><rect x="16.4" y="4.6" width="3.6" height="14.8" rx="1.2"/></symbol>
  <!-- штанга насосная: пруток с высадками -->
  <symbol id="mi-rod" viewBox="0 0 24 24"><rect x="2.4" y="10.1" width="19.2" height="3.8" rx="1.2"/><path d="M7.4 8.4v7.2M16.6 8.4v7.2"/></symbol>
  <!-- лом чёрных металлов: обломки -->
  <symbol id="mi-scrap" viewBox="0 0 24 24"><path class="f" d="M2.6 19.4l3.6-6.2 5 2.6-1.4 3.6z"/><path class="f" d="M9.4 12.2l2.6-6 5.2 2-1.8 4.6z"/><path class="f" d="M14.6 19.4l4.6-4 2.2 4z"/></symbol>
  <!-- лом цветных металлов: слитки -->
  <symbol id="mi-color" viewBox="0 0 24 24"><path d="M8.2 6.6h7.6l2.2 4.2H6z"/><path d="M4.4 13h15.2l2.4 4.6H2z"/></symbol>
  <!-- лом легированной стали: обломки с блеском -->
  <symbol id="mi-alloy" viewBox="0 0 24 24"><path class="f" d="M2.8 19.6l4.2-7 5.6 2.8-1.6 4.2z"/><path class="f" d="M12.4 13.4l2.2-5 4.8 1.9-1.7 4.1z"/><path d="M19.4 2.6l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/></symbol>
  <!-- кабель: две жилы. Бухта (кольцо в кольце) читалась как глаз -->
  <symbol id="mi-cable" viewBox="0 0 24 24"><path d="M2 8.6c3.2-3.4 6.4 3.4 9.6 0s6.4 3.4 9.6 0"/><path d="M2 15.4c3.2-3.4 6.4 3.4 9.6 0s6.4 3.4 9.6 0"/></symbol>
  <!-- трансформатор: сердечник с обмотками -->
  <symbol id="mi-trafo" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="1.2"/><path d="M9.2 4.6v14.8M14.8 4.6v14.8"/><path d="M9.2 8.4h5.6M9.2 12h5.6M9.2 15.6h5.6"/></symbol>
  <!-- комплектующие с разбора: гайка и болт -->
  <symbol id="mi-parts" viewBox="0 0 24 24"><path d="M8.6 3.4h5.6l2.8 4.8-2.8 4.8H8.6L5.8 8.2z"/><circle cx="11.4" cy="8.2" r="2"/><rect x="5.4" y="15.2" width="9.6" height="3.6" rx="1"/><path d="M15.4 14.2v5.6"/></symbol>
  <!-- ДХНО: бочка и капля (катализаторы, отработанные масла) -->
  <symbol id="mi-dhno" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="11.2" height="14.8" rx="2"/><path d="M3.4 8.4h11.2M3.4 15.6h11.2"/><path d="M19.4 11.2c1.4 1.9 2.2 3.1 2.2 4.1a2.2 2.2 0 0 1-4.4 0c0-1 .8-2.2 2.2-4.1z"/></symbol>
  <!-- прочее -->
  <symbol id="mi-other" viewBox="0 0 24 24"><path d="M12 2.8l8.6 4.6v9.2L12 21.2l-8.6-4.6V7.4z"/><path d="M3.4 7.4L12 12l8.6-4.6M12 12v9.2"/></symbol>
  <!-- группа учёта в 1С не заполнена -->
  <symbol id="mi-none" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke-dasharray="3 2.6"/></symbol>
</defs></svg>
<header>
  <!-- ⚠️ HREF ЗДЕСЬ НЕТ НАРОЧНО, его проставляет скрипт и только если страница
       открыта С СЕРВЕРА. Дашборд — самодостаточный файл на 62 МБ, его скачивают
       и открывают с диска; у такого файла адреса сервера нет, и ссылка «на
       страницу управления» вела бы в никуда. Мёртвая кнопка в шапке читается
       как «отчёт сломался», поэтому у файла с диска значок остаётся картинкой. -->
  <a class="logolink" id="homeLink">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 94,88 6,88" fill="none" stroke="currentColor" stroke-width="7"/>
      <polygon points="50,34 74,80 26,80" fill="currentColor"/>
    </svg>
  </a>
  <div class="brand">МЕТОПТОРГ<small>Реализация · что, сколько и по какому бизнес-плану / серии продано</small></div>
  <div class="hmeta">
    <div>Период <b id="mPeriod">—</b></div>
    <div id="mTotals"></div>
  </div>
  <div class="hact">
    <button class="btn" id="wrapBtn" title="Подписи целиком: строка растёт в ширину (таблица прокручивается вбок), а не переносится по высоте">⇥ Подписи целиком</button>
    <button class="btn" id="themeBtn" title="Тема">🌓 Тема</button>
    <!-- ⚠️ HREF ставит скрипт и только с сервера — как у логотипа (см. ниже):
         у файла, открытого с диска, адреса сервера нет. -->
    <a class="btn" id="adminBtn" hidden title="Управление отчётом: пересборка, источники, история сборок — только для администраторов">⚙ Управление</a>
  </div>
</header>

<!-- ⚠️ ПОРЯДОК ВКЛАДОК ЗАДАН ЗАКАЗЧИКОМ 13.08.2026 (совещание с ген- и
     исполнительным директором): продажи -> весь оборот -> Ганта, затем разрезы
     одной группой, затем работа с данными, выгрузка в 1С последней.
     Группы сделаны ВИДИМЫМИ КЛАСТЕРАМИ, а не выпадающими списками: отчёт
     смотрит руководство, и вкладка, спрятанная за раскрывашкой, для них просто
     не существует. Кластер даёт порядок, ничего не пряча. -->
<nav class="tabs" id="tabs">
  <button data-t="series" class="active" title="Что ПРОДАНО по каждому бизнес-плану. Отчёт считается в ОДНОЙ единице, она выбирается вверху; планы, где в этой единице не продавали, из списка уходят.">Продажи по сериям</button>
  <button data-t="series_all" title="ВЕСЬ оборот металла по бизнес-планам, включая непроданное. Единица здесь — уровень дерева: под проектом идут тонны, штуки, метры… Суммы разных единиц не складываются.">Весь оборот по сериям</button>
  <button data-t="gantt">План-факт (Ганта)</button>
  <!-- «Остатки» — перед дашбордом (заказчик 14.09.2026) -->
  <button data-t="stock" title="Остатки в разрезе отчёта 1С: подразделение → группа аналитического учёта → номенклатура, по двум вариантам. Те же цифры, что на Ганте и в дереве движений — для сверки с 1С.">Остатки</button>
  <button data-t="dash" title="Сигнальный экран: невывезенные объёмы по дивизионам и глубине просрочки; клик по сегменту открывает Ганту с уже выставленными фильтрами.">Дашборд</button>
  <button data-t="summary" title="Экран для совещания: сколько не вывезено и не продано, с какой глубиной просрочки, в разрезе направлений, дивизионов и групп учёта.">Сводные</button>
  <span class="tgrp" data-label="разрезы">
    <button data-t="period">Периоды</button>
    <button data-t="flows">Закупки / продажи</button>
    <button data-t="moves">Движения</button>
  </span>
  <span class="tgrp" data-label="данные">
    <button data-t="bpbuy" title="Закупка по бизнес-плану: что оприходовали по головной серии в разрезе нашей номенклатуры и складов, рядом плановая выручка версии расчёта.">Закупка по БП</button>
    <button data-t="bpver" title="Версии расчётов из excel-файлов БП: экономист отмечает, какая верна, — её и используют алгоритмы (месяцы вывоза, план выручки).">Версии БП</button>
    <!-- ⚠️ «Проверка данных» и «Обновление данных» ИЗ НАВИГАЦИИ УБРАНЫ
         (заказчик 14.09.2026): это служебные вкладки, руководству они ни к
         чему. Код вкладок жив, открываются по адресу #check и #update —

  </span>
  <button data-t="export1c">Выгрузка в 1С</button>

<main id="app"></main>

<script>
/* ============================ ДАННЫЕ ============================ */
const DATA = /*__DATA__*/{"meta":{},"S":[],"items":[],"checks":[],"edits":[],"internal":[]}/*__END__*/;
window.DATA = DATA;
</script>
<script>
/* ============================ УТИЛИТЫ ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,cls,html)=>{const e=document.createElement(t); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
/* ⚠️ КОЛИЧЕСТВО — ВСЕГДА ТРИ ЗНАКА. Раньше «12» и «12,5» стояли в колонке рядом
   с «1 916,437»: разряды не выстраивались, и глаз читал числа разной точности как
   разные величины. Теперь у любого количества ровно три знака, а счётчики (штук
   бизнес-планов, строк, документов) идут через cnt() — там дроби не нужны. */
/* ⚠️ Формат СВОЙ, а не toLocaleString: на дереве из 868 строк формат вызывается
   девять тысяч раз и в браузере занимал 123 мс из 437 мс отрисовки вкладки.
   Разделитель разрядов — тот же неразрывный пробел, что даёт ru-RU. */
const NBSP = '\u00A0';
function fmt(n){
  if(n==null || isNaN(n)) return '';
  /* считаем в ТЫСЯЧНЫХ целыми: вычитание дробей давало 13 918,662 там, где
     округление даёт 13 918,663 */
  const neg = n < 0;
  const v = Math.round(Math.abs(n) * 1000);
  const fr = v % 1000;
  const d = String((v - fr) / 1000);
  let out = '', c = 0;
  for(let k = d.length-1; k >= 0; k--){
    out = d[k] + out;
    if(++c % 3 === 0 && k) out = NBSP + out;
  }
  return (neg?'-':'') + out + ',' + (fr<10?'00':fr<100?'0':'') + fr;
}
const fmt3 = fmt;
/* счётчик: целое с разрядами, «8 363» */
function cnt(n){
  if(n==null || isNaN(n)) return '';
  const d = String(Math.round(Math.abs(n)));
  let out = '', c = 0;
  for(let k = d.length-1; k >= 0; k--){
    out = d[k] + out;
    if(++c % 3 === 0 && k) out = NBSP + out;
  }
  return (n<0?'-':'') + out;
}
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = DATA.S||[];                       /* таблица строк (интернирование) */
const str = i => (typeof i==='number' ? (S[i]||'') : (i||''));
const META = DATA.meta||{};
const ITEMS = DATA.items||[];

const BADGE_RANK={'1С':0,'док':1,'переработка':2,'ручная':2,'площадка':3,'доля':3,'вероятно':4,'ввод':4,'нет':5};
const BADGE_TITLE = META.badge_title||{};
function badge(b){ b=b||'нет'; return '<span class="badge b-'+esc(b)+'" title="'+esc(BADGE_TITLE[b]||b)+'">'+esc(b)+'</span>'; }
const worstBadge=(a,b)=> a==null?b : b==null?a : (BADGE_RANK[a]>=BADGE_RANK[b]?a:b);
const REAL = r => r.series!=='БЕЗ СЕРИИ' && !String(r.series).startsWith('площадка:');

function groupBy(arr,keyfn){ const m=new Map(); for(const x of arr){const k=keyfn(x); if(!m.has(k))m.set(k,[]); m.get(k).push(x);} return m; }
function sum(arr,f){ let s=0; for(const x of arr)s+=f(x)||0; return s; }
function worstOf(arr){ let b=null; for(const x of arr) b=worstBadge(b,x.badge); return b; }
function baseSort(a,b){ if(a==='—')return 1; if(b==='—')return -1; return a.localeCompare(b,'ru'); }

/* ============================ РОУТИНГ ============================ */
const TABS={};
/* ---- Общая доводка любой вкладки после отрисовки ----
   Делается в одном месте, а не в девяти: вкладки строят разметку, а поведение
   на узком экране одинаково для всех. */
/* широкая таблица прокручивается вбок, а не ломает страницу на телефоне */
function wrapWideTables(root){
  root.querySelectorAll('.panel>table').forEach(t=>{
    if(t.parentElement.classList.contains('tw-scroll')) return;
    t.classList.add('sticky1');
    const box=el('div','tw-scroll');
    /* ⚠️ КНОПКА «ПОКАЗАТЬ ЕЩЁ» — ВНУТРЬ ПРОКРУТКИ, ПОД ТАБЛИЦУ (заказчик
       14.09.2026: «кнопка не нажимается из-за накладки» на «Версиях БП»).
       Контейнер липкий и ограничен по высоте: при прокрутке страницы он
       съезжает вниз и накрывает всё, что стоит за ним в панели, — кнопка
       оказывалась под последней строкой таблицы. Внутри контейнера она
       всегда в конце списка и всегда доступна. */
    const tail=[]; let nx=t.nextElementSibling;
    while(nx && nx.classList.contains('gmore')){ tail.push(nx); nx=nx.nextElementSibling; }
    t.parentNode.insertBefore(box,t); box.appendChild(t);
    tail.forEach(b=>box.appendChild(b));
  });
}
/* зона управления на узком экране сворачивается: на планшете она занимала три
   ряда и отодвигала данные ниже первого экрана */
function foldToolbars(root){
  root.querySelectorAll('.toolbar').forEach(bar=>{
    const prev=bar.previousElementSibling;
    if(prev && prev.classList.contains('fold')) return;
    const b=el('button','fold btn','⚙ Фильтры и поиск');
    /* ⚠️ СОСТОЯНИЕ ПАНЕЛИ ЗАПОМИНАЕТСЯ. Панель прячется на экранах уже 1024 px,
       и это ровно тот случай, когда заказчик не нашёл фильтр по оплате: он был
       на месте и работал, но за свёрнутой кнопкой. Один раз открыл — открыто
       и дальше. */
    const OPEN='metoptorg.filters';
    const setOpen=on=>{ bar.classList.toggle('open', on);
      b.setAttribute('aria-expanded', on?'true':'false');
      try{ localStorage.setItem(OPEN, on?'1':'0'); }catch(e){} };
    let was='1';
    try{ was = localStorage.getItem(OPEN); }catch(e){}
    setOpen(was===null ? true : was==='1');   /* по умолчанию РАСКРЫТО */
    b.addEventListener('click',()=>setOpen(!bar.classList.contains('open')));
    /* Сколько фильтров сейчас применено — прямо на кнопке. Иначе свёрнутая
       панель молчит о том, что список уже сужен, и цифры кажутся неверными. */
    const count=()=>{
      let n=0;
      bar.querySelectorAll('select').forEach(sel=>{
        if(sel.id==='gvar'||sel.id==='gsort'||/sort/i.test(sel.id)) return;
        if(sel.value && sel.selectedIndex>0) n++;
      });
      bar.querySelectorAll('input[type=checkbox]').forEach(c=>{ if(c.checked) n++; });
      bar.querySelectorAll('input[type=search],input.bpq').forEach(i=>{ if((i.value||'').trim()) n++; });
      b.textContent = '⚙ Фильтры и поиск' + (n ? ' · применено '+n : '');
      b.classList.toggle('on', n>0);
    };
    bar.addEventListener('change', count);
    bar.addEventListener('input', count);
    count();
    bar.parentNode.insertBefore(b,bar);
  });
}
/* ---------- ИТОГИ ОДНОЙ СТРОКОЙ ----------
   Решение заказчика 13.08.2026 (совещание с ген- и исполнительным директором):
   итог нужен вверху каждой вкладки, где есть что суммировать, но «очень
   лаконично, без сдвига данных». Пять карточек занимали около 140 px, и на
   ноутбуке таблица начиналась ниже сгиба — ради пяти чисел приходилось
   прокручивать.
   Переписываем УЖЕ СОБРАННЫЙ блок карточек, а не каждую вкладку по отдельности:
   вкладок с итогами семь, и правило должно быть одно на всех, иначе они
   разъедутся при следующей правке.
   ⚠️ ПОЯСНЕНИЕ ПОД ЧИСЛОМ НЕ ВЫБРАСЫВАЕТСЯ, а уходит в подсказку: там живут
   «86,3 % от купленного» и «не вывезено 13 196,283 т» — это не украшение.
   Ведущая карточка (.lead) остаётся крупнее прочих: у каждой вкладки есть
   главное число, и в ровной строке оно бы потерялось. */
function slimCards(root){
  root.querySelectorAll('.cards').forEach(box=>{
    const cards = [...box.querySelectorAll(':scope > .card')];
    if(!cards.length) return;
    const parts = cards.map(c=>{
      const k = c.querySelector('.k'), v = c.querySelector('.v'), s = c.querySelector('.s');
      const kt = k ? k.textContent.trim() : '';
      const st = s ? s.textContent.trim() : '';
      const cls = [ 'si', c.classList.contains('lead') ? 'lead' : '',
                    v && v.className ? v.className.replace('v','').trim() : '' ]
                  .filter(Boolean).join(' ');
      return '<span class="'+cls+'"'+(st?' title="'+st.replace(/"/g,'&quot;')+'"':'')+'>'
           + '<i>'+kt+'</i>' + (v ? v.innerHTML : '') + '</span>';
    });
    box.classList.add('sumline');
    box.innerHTML = parts.join('<b class="sep">·</b>');
  });
}
function render(tab){
  /* неизвестная вкладка (например старая ссылка #podr) -> на первую */
  /* старые ссылки и закладки на убранную вкладку «Направление» (#bp) ведут на
     «Серии (продано)»: то же дерево, направление осталось фильтром */
  if(tab==='bp') tab='series';
  if(!TABS[tab]) tab='series';
  /* ⚠️ Режим единиц принадлежит ВКЛАДКЕ, а не сессии. «Серии (насквозь)»
     фиксируют режим «все единицы», и без сброса он утекал на соседние вкладки:
     зайдя оттуда на «Движения», экономист видел количества в родных единицах 1С
     (5 450 кг в колонке рядом с тоннами), хотя вверху выбраны тонны. */
  try{ MEASURE_FORCED = null; UNIT_LEVEL = null; }catch(e){}
  $('#app').innerHTML='';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===tab));
  TABS[tab]($('#app'));
  slimCards($('#app'));
  wrapWideTables($('#app'));
  foldToolbars($('#app'));
  /* В КАКОЙ ЕДИНИЦЕ СМОТРИМ — плашкой наверху вкладки, а не только в панели
     фильтров: панель на узком экране свёрнута, а числа в таблице подписи не
     имеют, и «39 062,35» легко принять за тонны. Для тонн плашки нет — это
     обычный режим, лишний шум ни к чему. */
  if(typeof MEASURE !== 'undefined' && MEASURE !== 'т'
     && typeof MEASURE_FORCED !== 'undefined' && !MEASURE_FORCED){
    const b = el('div','measbar', 'Единица отчёта: <b>' + esc(mTitle(MEASURE))
      + ' (' + esc(MEASURE) + ')</b>. Видны только бизнес-планы с этой единицей; '
      + 'с тоннами эти суммы не сопоставимы и не складываются.');
    $('#app').insertBefore(b, $('#app').firstChild);
  }
  if(typeof fitSticky==='function') fitSticky();
  if(typeof applyDocFocus==='function') applyDocFocus();
  history.replaceState(null,'','#'+tab);
  /* вкладка сменилась — вернуться к началу, иначе открываешь новую страницу
     на середине предыдущей */
  window.scrollTo(0,0);
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)render(b.dataset.t); });
$('#themeBtn').addEventListener('click',()=>{ const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; localStorage.mo_theme=r.dataset.theme; });
if(localStorage.mo_theme) document.documentElement.dataset.theme=localStorage.mo_theme;

/* ---------- ЗНАЧОК В ШАПКЕ — ВЫХОД НА СТРАНИЦУ УПРАВЛЕНИЯ ----------
   ⚠️ Ссылка проставляется ТОЛЬКО когда отчёт открыт С СЕРВЕРА. Дашборд —
   самодостаточный файл на 62 МБ: его скачивают и открывают с диска, и адреса
   сервера у такого файла нет. Ссылка вела бы в никуда, а мёртвая кнопка в шапке
   читается как «отчёт сломался». Без href значок остаётся обычной картинкой.
   Адрес не зашит: берём корень ТОГО ЖЕ сервера, откуда пришла страница, — так
   отчёт одинаково работает и на 8092, и где угодно ещё. */
(function(){
  if(!/^https?:$/.test(location.protocol)) return;
  /* корень теперь сам дашборд; управление — /admin, там браузер спросит
     пароль администратора. Переход — кнопкой-шестерёнкой рядом с темой
     (заказчик 14.09.2026), логотип ведёт туда же. */
  const a = $('#homeLink');
  if(a){ a.href = '/admin'; a.title = 'На страницу управления отчётом (только для администраторов)'; }
  const g = $('#adminBtn');
  if(g){ g.href = '/admin'; g.hidden = false; }
})();

/* «Текст целиком»: подписи переносятся, а не обрезаются многоточием.
   Выбор запоминается — заказчик работает в одном режиме постоянно. */
function applyWrap(on){
  document.documentElement.classList.toggle('wide', !!on);
  localStorage.mo_wrap = on ? '1' : '';
  const b=$('#wrapBtn'); if(b) b.textContent = on ? '⇥ Подписи целиком' : '⇤ Подписи короче';
  if(window.fitLabels) fitLabels();
}
/* класс называется wide; проверка на 'wrap' была опечаткой, из-за которой
   кнопка всегда включала режим заново и переключиться было нельзя */
$('#wrapBtn').addEventListener('click',()=>
  applyWrap(!document.documentElement.classList.contains('wide')));
/* по умолчанию — целиком; если однажды переключили в строку, выбор запоминается */
applyWrap(localStorage.mo_wrap === undefined ? true : localStorage.mo_wrap === '1');

/* высоты липких полос — в переменные: шапка переносится на узком экране, и
   зашитые 49 px разъезжались с реальностью */
function fitSticky(){
  const h=document.querySelector('header'), n=document.querySelector('nav.tabs');
  if(!h) return;
  const hh=Math.round(h.getBoundingClientRect().height);
  /* на узком экране полоса вкладок не липкая (см. @media) — тогда её высоту
     прибавлять нельзя, иначе под шапкой останется пустая полоса, сквозь которую
     видно уезжающие строки */
  const navFix = n && getComputedStyle(n).position === 'sticky';
  const nh = navFix ? Math.round(n.getBoundingClientRect().height) : 0;
  const r=document.documentElement.style;
  r.setProperty('--hh', hh+'px');
  r.setProperty('--stick', (hh+nh)+'px');
}
window.addEventListener('resize', fitSticky);
window.addEventListener('load', fitSticky);
fitSticky();

$('#mPeriod').textContent=(META.period_min||'')+' … '+(META.period_max||'');
$('#mTotals').textContent = 'Продано: '+fmt(META.total_tonnes)+' т · с реальной серией: '
  +fmt(META.real_series_tonnes)+' т ('+META.real_series_pct+' %)';
</script>
