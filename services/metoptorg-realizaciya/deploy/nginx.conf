# nginx перед приложением: TLS, большие загрузки, сжатие 40-мегабайтного дашборда.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/metoptorg
#   sudo ln -s /etc/nginx/sites-available/metoptorg /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name metoptorg.example.ru;

    ssl_certificate     /etc/letsencrypt/live/metoptorg.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metoptorg.example.ru/privkey.pem;

    # Выгрузка движений весит ~300 МБ — запас берём с избытком.
    client_max_body_size 2g;
    # КЛЮЧЕВОЕ: не буферизовать тело запроса, иначе nginx сначала целиком
    # сложит файл к себе на диск, прогресс в браузере встанет на 100 %,
    # а приложение будет ждать. С отключённой буферизацией файл течёт сразу.
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Дашборд — один HTML на 40+ МБ, сжатие обязательно (в 6–8 раз).
    gzip on;
    gzip_types text/html application/json text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name metoptorg.example.ru;
    return 301 https://$host$request_uri;
}
