# Обратный прокси nginx для сервиса бизнес-планов: HTTPS на 8443.
#
# Установка:
#   cp deploy/nginx-bp-service.conf /etc/nginx/sites-available/bp-service
#   ln -s /etc/nginx/sites-available/bp-service /etc/nginx/sites-enabled/
#   deploy/make-cert.sh                      # сертификат, если его ещё нет
#   nginx -t && systemctl reload nginx
#
# Порт 8443 выбран потому, что сервер — общая витрина мини-сервисов, у
# каждого свой порт (портал 8079, БП 8093 и т.д.), а 443 могут занять под
# общий вход. Соответствие: 8093 — http, 8443 — https того же сервиса.

server {
    # http2 указан прямо в listen: отдельная директива «http2 on» появилась
    # только в nginx 1.25, а на сервере 1.24 из Ubuntu 24.04.
    listen 8443 ssl http2;
    server_name ubuntutest.ui.local 192.168.6.157;

    ssl_certificate     /etc/ssl/bp-service/bp-service.crt;
    ssl_certificate_key /etc/ssl/bp-service/bp-service.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BPSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;           # загрузка книг экономистов (xlsx)

    # Сервис отдаёт cookie сессии без флага Secure (он же работает и по
    # http на 8093). Здесь флаг добавляется на лету: по https cookie не
    # должна утекать в открытый канал.
    proxy_cookie_flags bp_session secure samesite=lax httponly;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Сервис доверяет этому заголовку ТОЛЬКО от локального прокси —
        # проверка сети и журнал видят настоящий адрес пользователя.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # импорт больших книг
    }
}
