# Планировщик (ofelia) — замена systemd-таймеров и cron.
# Формат schedule: секунды минуты часы день месяц день-недели.
# Время — по TZ контейнера scheduler (Asia/Yekaterinburg).

# Ночная пересборка реализации. НЕ РАНЬШЕ 04:00: в 01:00 «Extractor» обновляется из 1С.
[job-exec "realizaciya-nightly"]
schedule = 0 3 4 * * *
container = ai_mot-realizaciya
command = python /tools/nightly-rebuild.py

# Бэкап сервиса бизнес-планов (SQLite + вложения) — 02:30
[job-exec "bp-backup"]
schedule = 0 30 2 * * *
container = ai_mot-bp-service
command = python /tools/bp-backup.py

# Бэкап сервиса оценки КП — 03:30
[job-exec "kp-backup"]
schedule = 0 30 3 * * *
container = ai_mot-kp
command = python scripts/backup.py

# Еженедельная выгрузка «Проверка_БП» из Битрикса в data/ реализации — вс 03:10
[job-exec "bp-weekly"]
schedule = 0 10 3 * * 0
container = ai_mot-parser-bp
command = python bp_auto_export.py

# Утренняя сводка мониторинга в MAX — 08:00
[job-exec "monitor-summary"]
schedule = 0 0 8 * * *
container = ai_mot-monitor
command = python /app/monitor.py --summary
