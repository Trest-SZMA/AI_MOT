# HTTPS-обёртка для сервиса бизнес-планов: :8443 → bp-service:8093.
# Сертификат кладёт deploy/docker/setup.sh в ./certs (самоподписанный, SAN = IP сервера).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bp-service.crt;
    ssl_certificate_key /etc/nginx/certs/bp-service.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BPSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    # Сервис отдаёт cookie без флага Secure (работает и по http на 8093) — добавляем здесь.
    proxy_cookie_flags bp_session secure samesite=lax httponly;

    location / {
        proxy_pass http://bp-service:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
